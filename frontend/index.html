<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillsHub</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"> -->
  <meta name="description" content="Skill marketplace" />
  <script>
    (function () {
      try {
        // Theme: localStorage > OS preference > light
        var saved = localStorage.getItem('theme-preference');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
        // Locale: localStorage > browser language > en
        var locale = localStorage.getItem('locale-preference');
        if (locale === 'zh' || locale === 'en') {
          document.cookie = 'locale=' + locale + ';path=/';
        } else {
          var lang = navigator.language || '';
          if (lang.toLowerCase().startsWith('zh')) {
            document.cookie = 'locale=zh;path=/';
          }
        }
      } catch (e) { }
    })()
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
